name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build
        shell: cmd
        run: build.bat /nopause dist\ClawdPet.exe
      - name: Run isolated regression tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1 -Executable ./dist/ClawdPet.exe
      - name: Prepare portable package
        shell: pwsh
        run: Copy-Item README.md, AUTHORS.md, Connect-*.ps1, Invoke-CodexHook.ps1 -Destination dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ClawdPet-Windows
          path: dist/
          if-no-files-found: error
